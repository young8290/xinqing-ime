[package]
name = "xinqing-hub"
description = "心晴 Hub 的 Tauri 外壳：窗口、命令与事件（领域逻辑在 xinqing-hub-core，见 docs/adr/0007）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "xinqing_hub"

[[bin]]
name = "xinqing_hub"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[lib]
name = "xinqing_hub_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xinqing-hub-core = { path = "../core", features = ["specta"] }
xinqing-hub-gateway = { path = "../gateway" }
xqp = { path = "../../crates/xqp", features = ["specta"] }
tauri = { version = "2", features = ["specta"] }
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait = "0.1"
dirs = "6"
