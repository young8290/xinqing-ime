[package]
name = "xinqing-hub-core"
description = "心晴 Hub 的领域层与基础层（不依赖 Tauri / Windows，可在任意平台测试，见 docs/adr/0007）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xqp = { path = "../../crates/xqp" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
toml.workspace = true
regex.workspace = true
chrono.workspace = true
tokio.workspace = true
clap.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures = "0.3"
zeroize = "1"
# 导出我的数据（FR-DAT-03）：zip 只开 deflate，后端是纯 Rust 的 zlib-rs；sha2 给 manifest 算校验和
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
# 时间戳等不会是 NaN 的 f64 导出成 `number` 而不是 `number | null`（ADR 0027）
specta-typescript = { version = "0.0.12", optional = true }

[features]
# 给 Tauri 外壳导出 TypeScript 类型用（10 第 5.1 节）
specta = ["dep:specta", "dep:specta-typescript", "xqp/specta"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
