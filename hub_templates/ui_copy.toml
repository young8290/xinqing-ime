# 心晴 · 界面固定文案表（DS-COPY-01～11）
# 所有固定文案集中在这里，便于禁用词校验（banned_words.toml）、长度检查（DS-COPY-04）和统一修改。
# 键名格式：<场景>.<名称>；带 {变量} 的由代码填充。exempt 列表中的键允许出现求助类词语（banned_words.toml 第八节）。
# 长度：气泡 ≤ 16 字；小组件一句话 ≤ 30 字；通知标题 ≤ 20 字、正文 ≤ 40 字。
# 版本：v1（初稿，2026-10-04），状态：待评审

version = 1

[greeting]
first_run = "你好，我是晴晴。你正常打字就好，我在旁边陪着你。"
idle = "今天也辛苦啦"

[weather]                    # 天气名称（07 DS-COLOR 天气表）；状态行与读屏播报都用它，不能只靠颜色区分（DS-COLOR-02）
sunny = "晴"
wind = "一阵风"
cloudy = "多云"
rain = "小雨"
storm = "雷阵雨"
night = "夜"

[window]                     # 窗口标题，须与 xinqing_hub/src-tauri/tauri.conf.json 一致（gen-i18n 会核对）
widget = "心晴"
chat = "和晴晴聊聊"
dashboard = "情绪看板"
settings = "心晴设置"
onboarding = "欢迎使用心晴"

[widget]
paused = "休息中，不看你打字啦"
offline_badge = "离线"
cold_start = "正在熟悉你的打字习惯（{pct}%）"
waiting_ime = "等待输入法连接…"
self_reported = "你说的：{weather}"
self_report_prompt = "我现在…"
care_reduced = "我会少打扰你一些"
prob_hint = "{hedge}（可能性 {pct}%）"     # 悬停状态行时才显示概率（DS-COPY-02）
sprite_label = "心晴：{weather}"           # 读屏播报（DS-A11Y-02）

[self_report.options]
sunny = "☀️ 挺好"
cloudy = "⛅ 有点犹豫"
rain = "🌧 有点低落"
storm = "⛈ 有点烦"
night = "🌙 有点累"
unsure = "🤷 说不上来"

[tip]                       # 光标旁气泡，≤ 16 字
schedule = "📅 识别到日程"
todo = "✅ 识别到待办"
pause_on = "已暂停感知"
pause_off = "已恢复感知"
rewrite_need_commit = "先上屏再改写哦"
rewrite_no_text = "没有找到要改写的文字"
rewrite_done = "已改写，Ctrl+Z 可撤销"
rewrite_working = "✨ 改写中…"
rewrite_timeout = "暂时改写不了，稍后再试"
rewrite_budget = "今天改写次数用完了"
rewrite_unfit = "这段话不太好改，换个说法试试？"
rewrite_crisis = "要不要和晴晴聊聊？"      # 完整句见 rewrite.crisis_bubble
rest_eye = "看看远处吧"
rest_water = "喝口水吧"
rest_move = "起来走两步吧"
rest_night = "不早了，早点休息"

[rewrite]
crisis_bubble = "这段话里好像有很重的情绪，要不要和晴晴聊聊？"
first_use_notice = "按下改写键时，这段文字会发送给 AI 服务改写，不按就不会发送。在公开平台发布 AI 生成的内容时，请主动说明。"
candidate_title = "AI 改写 · {style}　Tab 换风格　Esc 取消"

[rest]                       # 小组件卡片
eye = "看看 6 米外的地方，休息 20 秒"
eye_done = "眼睛说谢谢你"
eye_tired = "打了很久啦，眼睛也累了吧"
water = "喝口水吧"
move = "站起来走两步吧"
night = "不早了，剩下的明天再说也来得及"
btn_done = "已完成"
btn_later = "5 分钟后"
btn_today_off = "今天不再提醒"
btn_drank = "喝了"

[notify]                     # 系统通知：禁止出现任何情绪状态词（DS-COPY-08）
schedule_title = "{title}"
schedule_body = "{time} 开始{location_suffix}"
deadline_body = "{time} 截止"
missed_title = "错过的提醒"
missed_body = "有 {n} 个提醒在你离开时到期了"
todo_title = "今天截止的待办"
todo_body = "{title}"
rest_title = "休息一下"
rest_body = "{text}"
btn_ok = "知道了"
btn_snooze = "5 分钟后"

[chat]
header_notice = "晴晴是 AI，回复内容由 AI 生成"
typing = "晴晴正在输入…"
stuck = "晴晴有点卡，稍后再试"
btn_retry = "重试"
btn_stop = "停止生成"
daily_cap = "今天聊了很多啦，明天继续？"
copy_suffix = "（内容由 AI 生成）"

[safety]
card = """你现在的感受很重要，你不需要一个人扛着。
📞 全国心理援助热线：12356
🚨 如果你正处在危险中，请立即拨打 110 或 120
👥 联系一个你信任的人：家人、朋友、辅导员或老师
🏫 学校心理中心：{school_phone}"""
school_phone_empty = "可在设置中添加"
btn_safe = "我现在是安全的"
btn_misread = "我说的不是这个意思"
learn_more = "心晴不会联系任何人，也不会替你拨打电话。如果你需要帮助，请直接拨打上面的电话，或者告诉身边信任的人。"
fallback_reply = "谢谢你愿意说出来。你现在安全吗？如果你有伤害自己的打算，请现在就拨打 12356，或者告诉身边一个你信任的人。我会一直在这里陪你说话。"

[error]                      # DS-COPY-06：说清发生了什么 + 可以怎么做，不显示错误码
generic = "出了点小问题，稍后再试一次吧。"
offline = "晴晴暂时连不上网络，先用离线模式陪着你。网络恢复后会自动切回来。"
