# 心晴 · 禁用词表（DS-COPY-03、C-ETH-01、C-LAW-06）
# 适用：大模型输出（08 第 5 节 V4）、本地模板、界面文案、系统通知——全部经过同一份校验。
# 修改本文件必须两人评审，其中一人为产品与质量负责人 E（10 第 7 节、13 第 5 节）。
# 版本：v2（2026-10-04，E-08 评审补充），状态：待第二人评审

version = 2

# 一、诊断与医疗类（C-LAW-06：不诊断、不治疗、不宣传疗愈）
diagnosis = [
  "抑郁", "抑郁症", "焦虑症", "焦虑障碍", "双相", "躁郁", "强迫症", "精神分裂",
  "心理疾病", "精神疾病", "精神病", "神经病", "心理问题", "心理障碍", "人格障碍",
  "病了", "生病了", "有病", "患者", "病情", "症状",
  "诊断", "确诊", "评估结果", "量表", "治疗", "疗愈", "治愈", "疗效", "康复",
  "吃药", "服药", "用药", "药物",
  "躁狂", "多动症", "自闭症", "厌食症", "暴食症", "进食障碍", "创伤后应激", "PTSD", "ADHD",
]

# 二、监控感措辞（C-ETH-03、DS-COPY-02：不说“检测到”，不暗示在看用户）
surveillance = [
  "检测到", "监测到", "监测", "监控", "侦测", "识别到你的情绪", "分析了你",
  "我看到你打", "你刚才打的", "根据你输入的内容", "情绪异常", "状态异常", "异常",
  "我注意到你", "我观察到", "数据显示你", "你的数据显示",
]

# 三、命令与说教（DS-COPY-01、产品原则 4）
preachy = [
  "你应该", "你必须", "你一定要", "你不能", "你不该", "必须马上", "赶紧去",
  "想开点", "想开一点", "别想太多", "这有什么", "矫情", "玻璃心", "至于吗", "多大点事", "你要坚强",
]

# 四、制造依赖（C-ETH-05、FR-CMF-06）
dependency = [
  "只有我", "离不开我", "只有我懂你", "我是你唯一", "唯一的朋友", "唯一懂你",
  "不要告诉别人", "别和别人说", "只跟我说", "我爱你", "做你女朋友", "做你男朋友",
]

# 五、作息与激励用语（DS-COPY-09、DS-COPY-10）
routine = [
  "睡眠质量", "睡眠监测", "失眠", "睡眠障碍",   # “不等于入睡时间”是 FR-REV-03 规定的说明文案，故不禁“入睡时间”
  "断签", "连续打卡", "再不来就", "打卡失败", "签到中断",
]

# 六、正则模式（任何一条匹配即判定不通过）
patterns = [
  "检测到.{0,6}(情绪|状态|心情)",
  "你(现在|今天)?(很|非常|特别)?(抑郁|焦虑|崩溃)",
  "你(可能|好像|似乎|大概)(是|有)?(有点|有些|一点)?(抑郁|焦虑)",
  "连续.{0,3}\\d+.{0,2}天",
]

# 七、对话场景放行（只用于 P-CHAT / P-CHAT-SAFE 的输出）
# FR-CHT-03 要求晴晴在被问到用药、医疗问题时“建议寻求专业人士帮助”，这类回复会自然提到下列词。
# 它们在对话输出中放行；其余场景（暖心话、周信、日记、模板、界面、通知）仍然禁止。
# “失眠”：用户在对话里说自己失眠时，晴晴的回应会自然复述这个词；DS-COPY-09 禁的是作息统计里把停止打字时间说成失眠。
chat_allow = ["吃药", "服药", "用药", "药物", "医生", "症状", "治疗", "心理问题", "失眠"]

# 八、豁免：以下固定文案由人工撰写、经评审，允许出现上面的词（例如求助卡片中的“心理援助热线”）。
# 校验器在检查这些 id 对应的文案时跳过本表；AI 输出永不豁免。
exempt_copy_ids = ["safety.card", "safety.fallback_reply", "safety.learn_more", "about.disclaimer", "onboarding.not_medical"]

# 说明：
# - 匹配前先做全角转半角、去空格；英文不区分大小写。
# - “药物”“治疗”等词也会出现在用户自己的对话里——本表只校验【心晴输出给用户看的文字】，不校验用户输入。
# - 自伤方法的描述由 crisis_lexicon.toml 的 method 类条目覆盖（08 第 5 节 V6），不在本表重复。
