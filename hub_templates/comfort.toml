# 心晴 · 本地暖心话模板（FR-CMF-03、FR-CHT-10、FR-STA-10）
# 结构：[[<风格>.<组>]]，风格 gentle（温柔，默认）/ lively（元气）；“简洁”风格从 gentle 中选取 ≤ 15 字的句子。
# 组：hesitant 犹豫 / low 低落 / agitated 烦躁 / tired 疲劳 / late_night 深夜 / cheer 平常的鼓励
# 要求：每组 ≥ 15 句；6–30 个汉字；通过 banned_words.toml 校验；不提“打字”“观察”“检测”；
#       每句最多一个 emoji、最多一个感叹号（DS-COPY-01）。
# 人工撰写、两人以上审核后才能使用；模板句不加“AI 生成”标识（FR-CMF-03 第 3 条）。
# 自评回应（FR-STA-10）复用本文件：有点犹豫→hesitant，有点低落→low，有点烦→agitated，有点累→tired。
# 版本：v1（初稿，2026-10-04），状态：待两人评审

version = 1

