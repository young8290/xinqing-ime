# 心晴 · 周信兜底模板的配套句子（FR-REV-02，与 letter_fallback.md 一起用）
# rest_comment：接在“休息提醒完成了 N%，”后面，按完成率选（≥70% high，30–69% mid，<30% low）。
# tip：“下周可以试试：”后面的一句，按 late → rest_low → hard → default 的顺序取第一条符合的：
#   late     ：这周有 ≥2 晚停止打字晚于 23:30，或平均停止打字时间晚于 23:30
#   rest_low ：休息完成率 < 30%
#   hard     ：这周有某个时段更容易累（hard_slot）
#   default  ：都不符合时
# 用语约束同 letter_fallback.md：不说“睡眠质量”“失眠”，作息只说“停止打字的时间”；不说教（不用“你应该”“必须”）；不出现禁用词。
# 版本：v1（初稿，2026-10-06，C），状态：待评审（E）

version = 1

[rest_comment]
high = "照顾自己这件事做得很好。"
mid = "有一半左右的时候停下来缓了缓，已经很不错了。"
low = "忙起来顾不上休息也很正常。"

[[tip]]
when = "late"
text = "找一两个晚上，比平时早半小时合上电脑。"

[[tip]]
when = "rest_low"
text = "下次休息提醒出现时，先站起来伸个懒腰再继续。"

[[tip]]
when = "hard"
text = "在容易累的那个时段前，给自己留五分钟喝口水、看看窗外。"

[[tip]]
when = "default"
text = "每天给自己留十分钟什么都不做的时间。"
