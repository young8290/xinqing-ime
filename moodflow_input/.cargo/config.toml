# 别名与验收标准/CI 同一份命令，防命令漂移（见 crates/moodflow-ui-types/AGENTS.md）。
[alias]
# headless 形态（Android/FFI 路径）在 host 上的编译门。
check-headless = "check -p moodflow-coordinator --no-default-features"
# Android target 编译门：moodflow-mobile 全包（移动端门面，闭包含 coordinator headless）。
# webdata 独立成 moodflow-webdata 后闭包为纯 Rust，**免 NDK 本机可跑**
# （rustup target add aarch64-linux-android 即可）；编不过且报缺 C 编译器 =
# 有人把 -sys crate 混回了闭包，先查依赖别配 NDK。
#
# ⚠ 本门**不覆盖 JNI 绑定层**（cdylib / jni / logcat 的 cfg 分支）——那一层在
# moodflow_android/rust（独立 workspace），由 .github/workflows/android.yml 用 cargo-ndk
# 真正交叉编译 .so 时把关（比 check 更强）。这里过了不等于 APK 构建得出来。
check-android = "check -p moodflow-mobile --target aarch64-linux-android"
