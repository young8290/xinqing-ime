[package]
name = "moodflow-mobile"
version.workspace = true
edition.workspace = true

# 移动端形态的核心门面。**平台绑定层不在这里**——Android 的 JNI 绑定在本仓
# `moodflow_android/rust/moodflow-android`（独立 workspace），只经本 crate 一条 path 依赖对接。
#
# 因此这里不该出现 uniffi / jni / objc 之类的绑定框架依赖：本 crate 一旦沾上某个
# 平台的绑定框架，"接口层"就退化成"那个平台的实现层"，第二个平台再来就只能复制粘贴。
[dependencies]
moodflow-coordinator = { path = "../moodflow-coordinator", default-features = false }
moodflow-host = { path = "../moodflow-host" }
moodflow-bridge = { path = "../moodflow-bridge" }
moodflow-config = { path = "../moodflow-config" }
moodflow-ipc = { path = "../moodflow-ipc" }
# 引导键的键名 ↔ 字符对照（设置端的触发键控件与工具栏入口共用，见 symbol_keys）
moodflow-keys = { path = "../moodflow-keys" }
moodflow-ui-types = { path = "../moodflow-ui-types" }
# XSIME 吸收计划的纯逻辑 crate（见 docs/design/xsime-feature-port-plan.md §4）：本 crate 只给
# 与绑定框架无关的门面（buffer / clipboard / chord / t9 模块），宿主不直接依赖它们。
moodflow-buffer = { path = "../moodflow-buffer" }
moodflow-clipboard = { path = "../moodflow-clipboard" }
moodflow-chord = { path = "../moodflow-chord" }
# 九宫格切分（`pinyin::t9`）；本就在 coordinator 闭包里，直连不增加依赖面
moodflow-engine = { path = "../moodflow-engine" }
tracing = { workspace = true }
# 配置快照的序列化与写入值的构造（见 config_api）。配置文件本身就是 TOML，
# 宿主侧也已有解析器，用同一种表示就不需要第二套映射。
toml = { workspace = true }

[lints]
workspace = true
