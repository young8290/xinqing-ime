# 心晴 AI 接口配置示例（14 第 4 节）。只含占位符，可以提交。
# 真实值只在 Hub 设置页填写（DPAPI 加密保存），或放在本机未入库的 secrets.toml。
# 开发阶段不需要任何真实密钥：启动 tools/mock-ai，Hub dev 构建默认连接 http://127.0.0.1:18080。

[jev]
base_url = "https://<jev 中转地址>/v1/systemone"
api_key  = "<在设置页填写>"
model    = "jev-latest"        # 稳定后固定为 jev-1.13.0（FR-AIG-02）

[llm]
base_url = "https://<大模型中转地址>/v1"
api_key  = "<在设置页填写>"
models   = ["<模型1>", "<模型2>"]   # 按优先级排列（FR-AIG-03）
