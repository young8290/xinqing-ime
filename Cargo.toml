# 心晴的 Cargo workspace（Hub、XQP、开发工具）。输入法核心是 wind_input/ 下另一个 workspace，
# 两者互不包含（docs/adr/0007）。
[workspace]
resolver = "2"
exclude = ["wind_input", "wind_linux", "wind_macos"]
members = [
    "crates/xqp",
    "xinqing_hub/core",
    "xinqing_hub/gateway",
    "xinqing_hub/src-tauri",
    "tools/xq-sim",
    "tools/mock-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
