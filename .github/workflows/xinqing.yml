# 心晴 CI（产品书 14 第 6 节）：Hub、XQP、开发工具、模板与评测。CI 不通过不得合并（NFR-MNT-01）。
# 输入法核心（wind_input/、wind_tsf/）仍由上游的 ci.yml 把关；密钥扫描在 xinqing-secrets.yml，所有改动都跑。
name: XinQing
on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "protocol/**"
      - "xinqing_hub/**"
      - "hub_templates/**"
      - "tools/**"
      - "eval/**"
      - ".github/workflows/xinqing.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "protocol/**"
      - "xinqing_hub/**"
      - "hub_templates/**"
      - "tools/**"
      - "eval/**"
      - ".github/workflows/xinqing.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # Hub 外壳（Tauri）在 Linux 上编译需要 WebKitGTK
      - name: 安装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: 前端类型绑定与命令定义一致
        run: |
          cargo run -q -p xinqing-hub --bin export-bindings
          git diff --exit-code -- xinqing_hub/src/api/bindings.ts

  hub-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: xinqing_hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: xinqing_hub/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: xinqing_hub/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: 界面文案与 hub_templates 一致
        run: pnpm gen:i18n --check
      - run: pnpm lint            # ESLint + Prettier + vue-tsc
      - run: pnpm test            # Vitest（单次运行）
      - run: pnpm build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { package_json_file: xinqing_hub/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: xinqing_hub/pnpm-lock.yaml }
      - run: cargo test --workspace
      - run: cargo build --release -p xq-sim -p mock-ai -p xinqing-hub-core
      - name: 构建 Hub（只出可执行文件，不打安装包，03 第 7 节）
        working-directory: xinqing_hub
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install jsonschema opencc-python-reimplemented
      - name: 繁转简字表与危机词表同步
        run: python3 tools/gen_crisis_t2s.py --check
      - name: 回放脚本符合 XQP schema
        run: python3 tools/check_xqp_scripts.py
      - name: Rust 序列化结果符合 XQP schema
        run: |
          mkdir -p "$RUNNER_TEMP/xqp"
          for f in tools/xq-sim/scripts/*.jsonl; do
            cargo run -q -p xq-sim -- --script "$f" --stdout > "$RUNNER_TEMP/xqp/$(basename "$f")"
          done
          python3 tools/check_xqp_scripts.py "$RUNNER_TEMP/xqp"
      - name: 出厂模板校验
        run: python3 tools/check_templates.py hub_templates
      - name: 危机词表评测与对拍文件一致
        run: |
          python3 eval/tools/check_crisis.py --golden "$RUNNER_TEMP/golden.json"
          diff -u eval/datasets/e_crisis.golden.json "$RUNNER_TEMP/golden.json"
          python3 eval/tools/check_crisis.py --golden "$RUNNER_TEMP/golden_ext.json" hub_templates/crisis_lexicon.toml eval/datasets/e_crisis_ext.jsonl
          diff -u eval/datasets/e_crisis_ext.golden.json "$RUNNER_TEMP/golden_ext.json"
      - name: 特征与基线的 Python 参考实现和对拍文件一致
        run: |
          python3 eval/tools/features_ref.py --out "$RUNNER_TEMP/features"
          for f in e_features_cases.jsonl e_features.golden.json e_baseline.golden.json; do
            diff -u "eval/datasets/$f" "$RUNNER_TEMP/features/$f"
          done
