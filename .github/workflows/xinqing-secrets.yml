# 心晴：密钥扫描（产品书 14 第 1 节第 7 步、NFR-SEC-02）。任何真实 API 密钥都不得入库，所以不按路径过滤。
name: XinQing secrets
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action 在 PR 上要读取提交列表，默认令牌没有 pull-requests 读权限会 403
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
