name: CI

# push/PR 门禁:全程 ubuntu-latest 交叉编译校验(无需 Windows runner)。
on:
  push:
    branches: [main]
    # Moodflow：只动 Moodflow 部分（Hub、开发工具、模板、评测；由 moodflow.yml 把关）时不跑输入法核心的交叉编译。
    # crates/mfp、protocol/ 将来被 moodflow-tap 引用，不在忽略之列。
    paths-ignore: ['**.md', 'docs/**', 'moodflow_hub/**', 'tools/**', 'hub_templates/**', 'eval/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/moodflow*.yml']
  pull_request:
    branches: [main]
    # Moodflow：只改文档的 PR 也不跑（以前推一个改 AGENTS.md 的提交会取消正在跑的整轮 CI）
    paths-ignore: ['**.md', 'docs/**', 'moodflow_hub/**', 'tools/**', 'hub_templates/**', 'eval/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/moodflow*.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moodflow：原来一个 job 串行跑 fmt → clippy(msvc) → 本机测试，约 15 分钟，几乎全花在两套 target
  # 各编一遍工作区上（测试本身只跑 20 秒）。拆成 check（fmt、clippy、Android、TSF）与 test
  # 两个并行 job，墙钟时间约减半；job 名 check 保持不变。
  check:
    runs-on: ubuntu-latest
    # Moodflow：私有仓库的 runner 磁盘小，msvc 交叉编译和本机测试两套 target 带完整调试信息会写满磁盘
    # （No space left on device）。调试信息只留行号表，测试失败时回溯仍有文件和行号。
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Moodflow：删掉本任务用不到的预装 SDK（.NET、Android、GHC、CodeQL），腾出二十多 GB。
      # 放到后台删：前台删要 2 分钟，而前面几步装工具链用不了多少磁盘，编译开始前就删完了
      - name: 释放 runner 磁盘空间
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - uses: actions/checkout@v7

      # 改名前的名字不得再出现（ADR 0045）
      - name: 产品名检查
        run: python3 scripts/moodflow/check_names.py

      # 统一 MSVC 工具链:clang-19(C++ TSF 需 clang≥19)+ lld-19 + llvm-19;
      # cargo-xwin 交叉编 Rust、clang 交叉编 C++ TSF,均经 MSVC SDK(无需 mingw)。
      - name: 安装 clang-19/lld-19/llvm-19
        run: sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-linux-android
          components: rustfmt, clippy

      - name: 安装 cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # 缓存 MSVC CRT/Windows SDK(xwin 首次下载约数百 MB)
      - name: 缓存 xwin SDK
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: moodflow_input

      # Moodflow：原来是 dev.sh ci（fmt + clippy + test），测试移到下面的 test job
      - name: fmt 检查
        run: ./scripts/dev.sh fmt-check

      - name: clippy (msvc target, -D warnings)
        run: ./scripts/dev.sh clippy-deny

      # headless/Android 防走样三道闸:
      # ① check 对象是 **moodflow-mobile 全包**(移动端门面,闭包含 coordinator headless):
      #    同时锁三件事——headless 可编译、依赖闭包过 Android、moodflow-ui-types 没长出
      #    无条件平台依赖。此前只 check coordinator,主线改动破坏门面要等安卓仓 build 才炸。
      #
      #    ⚠ 本步不覆盖 JNI 绑定层自身(cdylib / jni / logcat 的 cfg 分支):它在本仓
      #    moodflow_android/rust(独立 workspace),由 android.yml 用 cargo-ndk 交叉编译真 .so
      #    并打进 APK 时把关(比 check 更强)。moodflow-mobile 在 android.yml 的路径过滤里,
      #    改它的公开面两条工作流都会跑。
      # ② tree-grep 断言依赖边本身——moodflow-ui 的平台代码全在 cfg 内,理论上可能在 android
      #    下编成空壳而不报错,①抓不到"coordinator 又直连 moodflow-ui"的回归,须对边断言。
      # ③ C 依赖卫兵:webdata(moodflow-transfer→zip→zstd-sys/bzip2-sys、fontdb)独立成
      #    moodflow-webdata 后,Android 闭包为纯 Rust——check 因此**不再需要 NDK**,本机也可跑。
      #    刻意不配 NDK 环境变量:谁把 -sys crate 混回闭包,这一步会当场编不过而暴露。
      - name: moodflow-mobile headless (aarch64-linux-android)
        working-directory: moodflow_input
        run: cargo check -p moodflow-mobile --target aarch64-linux-android

      - name: android 依赖树无 moodflow-ui / 无 C 依赖
        working-directory: moodflow_input
        run: |
          ! cargo tree -p moodflow-coordinator --no-default-features -e normal | grep -q "moodflow-ui v"
          ! cargo tree -p moodflow-mobile --target aarch64-linux-android -e normal | grep -qE "zstd-sys|bzip2-sys|fontdb"

      # moodflow_tsf 里被刻意剥出来的纯逻辑（判据/表结构，不含 Win32 头）——g++ 就能跑，
      # 约 10 秒。⚠ 上面那步交叉编译只保证 DLL 能编出来，**一条断言都不会执行**；
      # 这些测试此前只有手敲 g++ 才跑得到，等于不存在。在「游戏兼容这类改动无法在
      # CI 里真机验」的前提下，它们是唯一会自动执行的判据闸门，故单列一步。
      - name: moodflow_tsf 纯逻辑单测
        run: |
          for t in skip_key_table installer_guard uielement_policy; do
            g++ -std=c++17 -Wall -Wextra -Imoodflow_tsf/include -o "/tmp/$t" "moodflow_tsf/tests/${t}_test.cpp"
            "/tmp/$t"
          done

      - name: 交叉编译 TSF DLL (x64 + x86)
        run: |
          V="$(tr -d '[:space:]' < docs/VERSION)"
          make -C moodflow_tsf VERSION="$V"
          make -C moodflow_tsf x86 VERSION="$V"

  # Moodflow：从 check 拆出来的本机测试（dev.sh ci 的第三步），与 check 并行
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: 释放 runner 磁盘空间
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # 测试失败也存缓存：默认只在成功时存，一红就每轮从零编译（约 15 分钟）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: moodflow_input
          cache-on-failure: true

      - name: cargo test (本机，全工作区)
        run: ./scripts/dev.sh test

      # 插件 ABI 的端到端闸门：示例插件按开发者的方式编成 wasm，再用市场审核/客户端同一套检查加载并调用一次。
      # 宿主侧 ABI 一改坏（导出名、入参 JSON、指针打包），这一步当场红。
      - name: 示例插件编译、校验与调用
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown --manifest-path examples/plugins/pinyin-emoji/Cargo.toml
          cp examples/plugins/pinyin-emoji/target/wasm32-unknown-unknown/release/pinyin_emoji.wasm examples/plugins/pinyin-emoji/plugin.wasm
          cd moodflow_input
          cargo run -q -p moodflow-tools --bin plugin_tool -- try ../examples/plugins/pinyin-emoji xiao | tee /tmp/try.txt
          grep -q "😀" /tmp/try.txt

  # 门控: 仅当 macOS 相关路径改动时才触发 macOS 编译校验。
  # GitHub 不支持 per-job paths, 故用一个 ubuntu 廉价 job 输出是否命中, macos-check 据此 if 短路。
  changes:
    name: Detect macOS-related changes
    runs-on: ubuntu-latest
    # Moodflow：私有仓库的默认令牌读不到 PR 文件列表，paths-filter 会报 Resource not accessible
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            macos:
              - 'moodflow_macos/**'
              - 'moodflow_input/**'
              - 'scripts/mac/**'

  # macOS 门禁: Swift 与 Rust 双侧编译 + 单测, 不打包 .app(打包见 release.yml)。
  #
  # 为什么这里必须真跑测试和 clippy, 而不是像原来那样只 build/check:
  # 上面的 check job 全程针对 x86_64-pc-windows-msvc, 一切 #[cfg(target_os = "macos")]
  # 的代码对它都不存在 —— 而 macOS 侧的定位/截图/主题/热键都是大段 cfg 独有实现。
  # 只 cargo check 也不够: check 不做单态化与代码生成, 测试更是完全不跑。
  macos-check:
    name: macOS Build & Test
    needs: changes
    # Moodflow 只做 Windows（产品书 02 C-PLT-01），fork 内不跑 macOS 门禁：私有仓库 macOS 分钟数按 10 倍计费
    if: github.repository == 'huanfeng/WindInput' && needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: moodflow_input

      - name: Build moodflow_macos (Swift IMKit)
        working-directory: moodflow_macos
        run: swift build

      - name: Test moodflow_macos (Swift)
        working-directory: moodflow_macos
        run: swift test

      # 与 Linux job 的 dev.sh ci 同一门禁口径：--all-targets 覆盖测试代码，-D warnings 挂新警告。
      # darwin 与 windows 走的 cfg 分支不同，本条是 macOS-only 代码的唯一 lint 关卡。
      # --keep-going 与下一步的 --no-fail-fast 同理由：两者默认都是首错即停，一轮只报得出
      # 一个问题，于是「推一次修一个」。macOS 是 darwin 侧代码的唯一关卡（上面的 check job
      # 全程跑 windows target），没有第二条路能提前发现剩下的，这里尤其需要一次看全。
      - name: Clippy moodflow_input (darwin)
        working-directory: moodflow_input
        run: cargo clippy --keep-going --workspace --all-targets -- -D warnings

      - name: Test moodflow_input (Rust core, darwin)
        working-directory: moodflow_input
        run: cargo test --workspace --no-fail-fast
