[package]
name = "pinyin-emoji"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

# 示例插件：独立工作区，不进 moodflow_input 的工作区与 CI 构建闭包。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
